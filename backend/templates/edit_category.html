<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Редактирай категория</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">RecipeApp</a>
    <div class="d-flex">
      <a class="nav-link" href="{{ url_for('admin_panel') }}">Админ панел</a>
      <a class="nav-link" href="{{ url_for('logout') }}">Изход</a>
    </div>
  </div>
</nav>
<div class="container">
    <h1 class="mb-4">Редактирай категория</h1>
    <form method="POST" class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <label class="form-label">Име на категорията:</label>
            <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Запази</button>
        <a href="{{ url_for('admin_categories') }}" class="btn btn-secondary ms-2">Назад</a>
    </form>
</div>
</body>
</html>
