<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <title>Добави рецепта</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">RecipeApp</a>
    <div class="d-flex">
      {% if current_user.is_authenticated %}
        <a class="nav-link" href="{{ url_for('profile', username=current_user.username) }}">Профил</a>
        <a class="nav-link" href="{{ url_for('logout') }}">Изход</a>
      {% else %}
        <a class="nav-link" href="{{ url_for('login') }}">Вход</a>
        <a class="nav-link" href="{{ url_for('signup') }}">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container">
    <h1 class="mb-4">Добави нова рецепта</h1>
    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <label for="title" class="form-label">Заглавие:</label>
            <input type="text" id="title" name="title" class="form-control" required />
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Описание:</label>
            <textarea id="description" name="description" rows="2" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label for="ingredients" class="form-label">Съставки:</label>
            <textarea id="ingredients" name="ingredients" rows="3" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label for="instructions" class="form-label">Инструкции:</label>
            <textarea id="instructions" name="instructions" rows="4" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Снимка:</label>
            <input type="file" name="image" accept="image/*" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Запази</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary ms-2">Назад</a>
    </form>
</div>
</body>
</html>
