{% extends "base.html" %}

{% block title %}Добави рецепта - RecipeApp{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Добави нова рецепта</h1>
                    <form method="POST" enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Заглавие</label>
                                    <input type="text" id="title" name="title" class="form-control" required />
                                </div>
                                <div class="mb-3">
                                    <label for="description" class="form-label">Кратко описание</label>
                                    <textarea id="description" name="description" rows="3" class="form-control" required></textarea>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="cooking_time" class="form-label">Време за готвене</label>
                                    <div class="input-group">
                                        <input type="number" id="cooking_time" name="cooking_time" class="form-control" min="1" step="1" required>
                                        <span class="input-group-text">мин</span>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="image" class="form-label">Снимка</label>
                                    <input type="file" id="image" name="image" accept="image/*" class="form-control">
                                    <div class="form-text">Препоръчителен размер: 800x600 пиксела</div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="ingredients" class="form-label">Съставки</label>
                            <textarea id="ingredients" name="ingredients" rows="5" class="form-control" required></textarea>
                            <div class="form-text">Въведете всяка съставка на нов ред</div>
                        </div>
                        <div class="mb-4">
                            <label for="instructions" class="form-label">Инструкции за приготвяне</label>
                            <textarea id="instructions" name="instructions" rows="8" class="form-control" required></textarea>
                            <div class="form-text">Въведете всяка стъпка на нов ред</div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-lg"></i> Добави рецепта
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-light">
                                <i class="bi bi-arrow-left"></i> Назад към всички рецепти
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
