<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">RecipeApp</a>
    <div class="d-flex">
      <a class="nav-link" href="{{ url_for('signup') }}">Регистрация</a>
    </div>
  </div>
</nav>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-info mt-3">{{ messages[0] }}</div>
  {% endif %}
{% endwith %}
<div class="container">
    <h1 class="mb-4">Вход</h1>
    <form method="POST" class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            <input type="text" name="username" placeholder="Потребителско име" class="form-control" required>
        </div>
        <div class="mb-3 position-relative">
            <input type="password" name="password" id="password" placeholder="Парола" class="form-control" required>
            <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none" onclick="togglePassword()">
                <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
        </div>
        <button type="submit" class="btn btn-primary">Вход</button>
    </form>
    <p class="mt-3">Нямаш акаунт? <a href="{{ url_for('signup') }}">Регистрация</a></p>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('bi-eye');
        toggleIcon.classList.add('bi-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('bi-eye-slash');
        toggleIcon.classList.add('bi-eye');
    }
}
</script>
</body>
</html>
