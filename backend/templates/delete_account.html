{% extends "base.html" %}

{% block title %}Изтрий акаунта - RecipeApp{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Изтрий акаунта</h1>
                    <div class="alert alert-danger text-center mb-4">
                        <i class="bi bi-exclamation-triangle-fill"></i> Сигурни ли сте, че искате да изтриете акаунта си? Това действие е необратимо.
                    </div>
                    <form method="POST" class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Изтрий акаунта
                        </button>
                        <a href="{{ url_for('profile', username=current_user.username) }}" class="btn btn-light">
                            <i class="bi bi-arrow-left"></i> Назад към профила
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
