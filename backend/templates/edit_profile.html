<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Редактирай профилна снимка</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">RecipeApp</a>
    <div class="d-flex">
      <a class="nav-link" href="{{ url_for('profile', username=current_user.username) }}">Профил</a>
      <a class="nav-link" href="{{ url_for('logout') }}">Изход</a>
    </div>
  </div>
</nav>
<div class="container">
    <h1 class="mb-4">Редактирай профилна снимка</h1>
    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm bg-white">
        <div class="mb-3">
            {% if user.profile_picture %}
                <img src="{{ url_for('static', filename='profile_pics/' ~ user.profile_picture) }}" alt="Profile Picture" width="120" class="rounded-circle mb-3">
            {% endif %}
            <input type="file" name="profile_picture" accept="image/*" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Обнови</button>
        <a href="{{ url_for('profile', username=current_user.username) }}" class="btn btn-secondary ms-2">Назад</a>
    </form>
</div>
</body>
</html>
