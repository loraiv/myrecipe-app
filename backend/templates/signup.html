{% extends "base.html" %}

{% block title %}Регистрация - RecipeApp{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4 text-center">Регистрация</h1>
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="alert alert-info">{{ messages[0] }}</div>
                      {% endif %}
                    {% endwith %}
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input type="text" name="username" placeholder="Потребителско име" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" name="email" placeholder="Email" class="form-control" required>
                        </div>
                        <div class="mb-3 position-relative">
                            <input type="password" name="password" id="password" placeholder="Парола" class="form-control" required>
                            <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-decoration-none" onclick="togglePassword()">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Профилна снимка</label>
                            <input type="file" name="profile_picture" accept="image/*" class="form-control">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Регистрация</button>
                        </div>
                    </form>
                    <p class="mt-3 text-center">Вече имаш акаунт? <a href="{{ url_for('login') }}">Вход</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('bi-eye');
        toggleIcon.classList.add('bi-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('bi-eye-slash');
        toggleIcon.classList.add('bi-eye');
    }
}
</script>
{% endblock %}
